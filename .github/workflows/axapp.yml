name: axapp
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: axapp
        run: xcodegen generate
      - name: Build
        working-directory: axapp
        run: |
          set -o pipefail
          xcodebuild -project AXTouch.xcodeproj -scheme AXTouch \
            -sdk iphoneos -configuration Release -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS=arm64 build > /tmp/xb.log 2>&1 || {
              echo "===== 编译错误 =====";
              grep -nE "error:|\.mm:[0-9]+:[0-9]+: error|\.m:[0-9]+:[0-9]+: error|\.swift:[0-9]+:[0-9]+: error" /tmp/xb.log | head -40;
              echo "===== 末 80 行 =====";
              tail -80 /tmp/xb.log;
              exit 1;
            }
          tail -20 /tmp/xb.log
          test -f dd/Build/Products/Release-iphoneos/AXTouch.app/AXTouch
          mkdir -p Payload
          cp -R dd/Build/Products/Release-iphoneos/AXTouch.app Payload/
          echo "--- app content ---"
          ls -la Payload/AXTouch.app
          du -sh Payload/AXTouch.app
          zip -qry AXTouch.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: axapp-ipa
          path: axapp/AXTouch.ipa
